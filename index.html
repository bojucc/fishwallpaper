<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#738c7c" />
  <meta name="description" content="一方碧潭，片刻闲心。投喂锦鲤、听雨观鱼，拥有属于自己的小小池塘。" />
  <title id="page-title">花港观鱼 - 桌面壁纸</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <script src="core.js" defer></script>
  <script src="art.js" defer></script>
  <script src="gl.js" defer></script>
  <script src="scene.js" defer></script>
  <script src="audio.js" defer></script>
  <script src="assets/pond-data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body class="app-loading">
  <main id="pond" aria-label="锦鲤池塘">
    <div class="pond-bed" aria-hidden="true"></div>
    <div class="pond-foreground" aria-hidden="true"></div>
    <div class="water-tint" aria-hidden="true"></div>
    <canvas id="world" tabindex="0" aria-label="交互池塘：点击水面投喂锦鲤，按空格在中央投喂"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <canvas id="labels" aria-hidden="true"></canvas>
    <header class="masthead ui">
      <span class="seal" aria-hidden="true">观</span>
      <div><h1>花港观鱼</h1><p>A LITTLE POND, A QUIET MIND</p></div>
    </header>
    <div class="weather-stack ui">
    <aside class="weather-card" aria-label="池塘信息">
      <div class="card-section card-section-top">
        <div class="weather-top"><span class="card-title" id="pond-name-display">花港观鱼</span><span class="weather-top-actions"><span class="quick-weather" aria-label="快速切换天气">
          <button data-quick-weather="sunny" aria-label="晴日" data-tooltip="晴日" aria-pressed="true" data-icon="sun"></button>
          <button data-quick-weather="cloudy" aria-label="多云" data-tooltip="多云" aria-pressed="false" data-icon="cloudy"></button>
          <button data-quick-weather="rain" aria-label="下雨" data-tooltip="下雨" aria-pressed="false" data-icon="rain"></button>
          <button data-quick-weather="snow" aria-label="落雪" data-tooltip="落雪" aria-pressed="false" data-icon="snow"></button>
        </span><button class="icon-button" data-panel="weather" aria-label="天气设置" data-tooltip="天气设置" data-icon="sliders"></button><button id="hide-card" class="icon-button" aria-label="隐藏卡片" data-tooltip="隐藏卡片" data-icon="eye-off"></button></span></div>
      </div>
      <div class="card-section card-section-weather">
        <div class="season-control" aria-label="池塘季节">
          <span id="season-label">池塘 · 自动</span>
          <div class="season-options">
            <button data-season="auto" aria-pressed="true">自动</button>
            <button data-season="spring" aria-pressed="false">春</button>
            <button data-season="summer" aria-pressed="false">夏</button>
            <button data-season="autumn" aria-pressed="false">秋</button>
            <button data-season="winter" aria-pressed="false">冬</button>
          </div>
        </div>
        <time id="clock">--:--</time><div id="calendar"></div>
        <div class="weather-location-middle"><strong id="weather-location">池畔时光</strong><small id="weather-mode">手动天气</small></div>
        <div class="weather-line"><span id="weather-symbol" data-icon="sun"></span><strong id="weather-label">晴日</strong><span id="temperature">随心天气</span></div>
        <div class="weather-foot"><span class="status-dot"></span><span id="weather-note">风轻水暖，正宜观鱼</span></div>
        <div class="forecast" id="forecast" aria-label="三天天气"></div>
      </div>
    </aside>
    <aside class="actions-card" aria-label="池塘操作与快捷设置">
      <div class="card-section card-section-actions">
        <nav class="card-primary-actions" aria-label="池塘内容">
          <button class="dock-button" data-panel="ranking" data-tooltip="食量榜" aria-label="食量榜"><span data-icon="trophy"></span><span class="icon-label">食量榜</span></button>
          <button class="dock-button" data-panel="fish" data-tooltip="我的锦鲤" aria-label="我的锦鲤"><span data-icon="fish"></span><span class="icon-label">我的锦鲤</span></button>
          <button id="feed-button" class="dock-button active" data-tooltip="投喂" aria-label="投喂" aria-pressed="true"><span data-icon="feed"></span><span class="icon-label">投喂</span></button>
        </nav>
        <nav class="card-utility-actions" aria-label="快捷设置">
          <button id="sound-button" class="dock-button" data-tooltip="声音" aria-label="开启声音" aria-pressed="false"><span data-icon="sound-off"></span><span class="icon-label">声音</span></button>
          <button class="dock-button" data-panel="settings" data-tooltip="设置" aria-label="设置"><span data-icon="sliders"></span><span class="icon-label">设置</span></button>
          <button id="zen-button" class="dock-button" data-tooltip="全屏" aria-label="进入沉浸模式"><span data-icon="expand"></span><span class="icon-label">全屏</span></button>
        </nav>
      </div>
    </aside>
    </div>
    <button id="show-card" class="show-card ui" aria-label="显示卡片" data-tooltip="显示卡片" data-icon="eye"></button>
    <p class="pond-hint ui" id="pond-hint">轻点水面，投下一点欢喜</p>
    <div class="pond-meta ui"><span class="status-dot"></span><span id="fish-count">24 尾锦鲤，悠然自得</span><span class="meta-divider"></span><span id="fed-count">今日投喂 0 次</span></div>
    <button id="exit-zen" class="zen-exit" hidden>退出沉浸 <kbd>Esc</kbd></button>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <dialog id="panel" aria-labelledby="panel-title">
    <div class="panel-header"><div><span class="eyebrow" id="panel-eyebrow">MY LITTLE POND</span><h2 id="panel-title">我的锦鲤</h2></div><button class="icon-button close-panel" aria-label="关闭面板" data-icon="close"></button></div>
    <div id="panel-content"></div>
  </dialog>
<!-- rightClickAction setting rendered by app.js --></body>
</html>
